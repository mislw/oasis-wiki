interface:
  display_name: "Oasis Wiki"
  short_description: "Use Oasis UGC docs, UI systems, and safe MCP workflows."
  default_prompt: "Use $oasis-wiki for Oasis UGC Lua, project-routed game UI component libraries, UI image generation, PSD hierarchy-to-UMG import, and UGCAskQ MCP work. For PSD input, parse the real group/layer tree, review the manifest and UI Tree, preserve semantic parents and Z-order, keep dynamic text native, and require an exact WidgetBlueprint path, preflight, external backup, and explicit authorization before editor writes. When UI generation, control slicing, or PSD hierarchy import is detected outside an active Cowart UI flow, offer the UI toolchain once per task; if accepted, synchronize the current context before continuing, and if declined, continue without interruption and do not ask again."

policy:
  allow_implicit_invocation: true
