interface:
  display_name: "Oasis Wiki"
  short_description: "Use Oasis UGC docs, UI systems, and safe MCP workflows."
  default_prompt: "Use $oasis-wiki for Oasis UGC Lua, project-routed game UI component libraries, UI image generation, PSD hierarchy-to-UMG import, and UGCAskQ MCP work. The native Companion UI workflow is enabled: open it only after an explicit request, verify the session identity, and never treat opening Companion as editor-write authorization. For PSD input, parse the real group/layer tree, review the manifest and UI Tree, preserve semantic parents and Z-order, keep dynamic text native, and require an exact WidgetBlueprint path, preflight, external backup, and explicit authorization before editor writes. When UI image generation or control slicing, or PSD hierarchy import, is detected outside an active Cowart UI flow, offer the UI toolchain once per task; if accepted, synchronize the current context before continuing, and if declined, continue without interruption and do not ask again. After Workbench saves layout-review.json with pending_chat_confirmation, verify session_sha256; must not choose the newest snapshot when multiple pages are pending, and saving layout does not authorize an editor write. For approved visual-to-UMG delivery, use the ui_delivery_contract, exact-reuse pixel lock, project-external audit outputs, and separate property readback, Designer visual, and PIE functional evidence."

policy:
  allow_implicit_invocation: true
