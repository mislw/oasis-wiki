interface:
  display_name: "Oasis Wiki"
  short_description: "Use Oasis UGC docs, UI systems, and safe MCP workflows."
  default_prompt: "Use $oasis-wiki for Oasis UGC Lua, project-routed game UI component libraries, UI image generation, and UGCAskQ MCP work. When UI image generation or control slicing is detected outside an active Cowart UI flow, offer the UI toolchain once per task; if accepted, synchronize the current context before continuing, and if declined, continue without interruption and do not ask again. The native Companion UI workflow is enabled: open it only after an explicit request or when presenting the exact generated review handoff, verify the session identity, and never treat opening Companion as editor-write authorization. After explicit chat confirmation, read layout-review.json only when it is pending_chat_confirmation, verify session_sha256, and must not choose the newest snapshot when multiple pages are pending; saved layout confirmation does not authorize an editor write. Build a UI Tree before visual generation, preserve control status/history, and search official references before conclusions."

policy:
  allow_implicit_invocation: true
